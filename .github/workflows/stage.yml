name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/datasetAnnotator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/datasetAnnotator/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Run test suite with coverage
        run: coverage run --source=da_app manage.py test

      - name: Generate coverage reports
        if: always()
        run: |
          if [[ -f .coverage ]]; then
            coverage report -m | tee -a "$GITHUB_STEP_SUMMARY"
            coverage html -d coverage-html
            coverage xml -o coverage.xml
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/datasetAnnotator/coverage-html/
            backend/datasetAnnotator/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/datasetAnnotatorFrontEnd
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/datasetAnnotatorFrontEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build